<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="通过统一认证中心安全登录 RootedVox。">
  <title>登录 · RootedVox</title>
  <script src="./request.js?v=20261101"></script>
  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
  <script src="/preferences.js"></script>
  <script defer src="/english.js?v=4.3.3"></script>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/preferences.css?v=4.3.3">
  <link rel="stylesheet" href="/account.css">
</head>
<body><main class="card">
  <a class="brand" href="/main"><img src="./images/logo-512-v1.webp" width="46" height="46" alt=""><span><strong>RootedVox</strong><small>统一认证登录</small></span></a>
  <h1>登录社区</h1>
  <p>登录将在统一认证中心完成。密码、Passkey、验证码和恢复方式不会交给本站处理。</p>
  <div class="notice">认证成功后，本站只保存自己的安全会话，不会把认证中心令牌写入浏览器存储。</div>
  <a class="button" id="loginButton" href="javascript:void(0);">前往统一认证中心</a>
  <p class="error" id="errorMessage" role="alert" hidden></p>
  <a class="back" href="/main">返回首页</a>
</main><script src="./auth-client.js"></script><script>
  const params=new URLSearchParams(location.search);
  const returnTo=RootedVoxAuth.safeReturnTo(params.get('returnTo')||params.get('return_to'),'/messages');
  document.getElementById('loginButton').onclick = (e) => {e.preventDefault(); RootedVoxAuth.handleLogin(returnTo);};
  const errors={access_denied:'你已取消登录。',invalid_request:'认证请求无效，请重新开始。',invalid_grant:'登录凭据已过期或已使用，请重新登录。',login_required:'认证中心要求重新登录。',interaction_required:'认证中心需要你完成额外验证。',state_mismatch:'登录请求已失效，请重新开始。',nonce_mismatch:'身份校验未通过，请重新登录。',pkce_mismatch:'登录请求校验失败，请重新开始。',expired_code:'登录凭据已过期，请重新登录。',used_code:'登录凭据已被使用，请重新登录。',token_endpoint_failure:'认证中心暂时无法完成登录。',authorization_server_unavailable:'认证中心暂时不可用，请稍后重试。',invalid_id_token:'身份令牌验证失败，请重新登录。',configuration_error:'登录服务尚未完成配置。',authentication_failed:'登录失败，请重新尝试。',id_token_algorithm_mismatch:'认证中心的签名算法不在本站允许列表内（请检查 OIDC_ALLOWED_ALGORITHMS）。',id_token_key_unavailable:'无法用认证中心公布的公钥验证身份令牌，可能是密钥刚轮换，请重新登录。',id_token_signature_invalid:'身份令牌签名校验失败，请重新登录。',id_token_issuer_mismatch:'身份令牌的签发者与本站配置不一致（请检查 AUTH_ISSUER）。',id_token_audience_mismatch:'身份令牌的受众不是本站客户端，需要在认证中心为该客户端配置 Audience mapper。',id_token_expired:'身份令牌已过期，请重新登录。',id_token_clock_skew:'本站与认证中心的时间不同步，请检查服务器时钟。',id_token_invalid:'身份令牌验证失败，请重新登录。',identity_mismatch:'认证中心返回的用户身份不一致，请重新认证。',business_store_unavailable:'业务数据库暂时不可用，请稍后重试。',business_store_permission_denied:'业务数据库拒绝了本次写入（权限不足，通常是缺少列级权限）。',business_store_key_rejected:'业务数据库不接受本站令牌（签名密钥不匹配）。',client_authentication_failed:'认证中心拒绝了本站的客户端身份，请检查 AUTH_CLIENT_SECRET 是否已按 Secret 类型配置且未过期。'};
  const error=errors[params.get('error')];if(error){const box=document.getElementById('errorMessage');box.textContent=error;box.hidden=false}
</script></body></html>
