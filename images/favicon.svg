  <!-- 黑色圆形底 -->
  <circle cx="256" cy="256" r="240" fill="#000"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#33FF66" stroke-opacity=".3" stroke-width="3"/>

  <!-- 斜线 //：在下层，像插进横边里 -->
  <g fill="#1FC24F">
    <polygon points="223.4,112 241.4,112 184.6,400 166.6,400"/>
    <polygon points="327.4,112 345.4,112 288.6,400 270.6,400"/>
  </g>

  <!-- 声纹横边：在顶层，带黑边压住斜线 -->
  <use href="#rows" fill="#000" stroke="#000" stroke-width="4"/>
  <use href="#rows" fill="#5CFF8A" opacity=".6" filter="url(#glow)"/>
  <use href="#rows" fill="#5CFF8A"/>
